<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>إرسال إشعارات - غصن مثمر</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    background: #0a0f1e;
    color: #e2e8f0;
    font-family: 'Segoe UI', Tahoma, sans-serif;
    min-height: 100vh;
    padding: 20px;
}
.header {
    text-align: center;
    padding: 30px 0 20px;
}
.header h1 {
    font-size: 26px;
    color: #f59e0b;
    margin-bottom: 6px;
}
.header p {
    color: #64748b;
    font-size: 13px;
}
.card {
    background: #1e293b;
    border-radius: 16px;
    padding: 20px;
    margin-bottom: 16px;
    border: 1px solid #334155;
}
.card h3 {
    color: #f59e0b;
    font-size: 15px;
    margin-bottom: 14px;
    display: flex;
    align-items: center;
    gap: 8px;
}
input, textarea {
    width: 100%;
    background: #0f172a;
    border: 1px solid #334155;
    border-radius: 10px;
    padding: 12px;
    color: #e2e8f0;
    font-family: inherit;
    font-size: 14px;
    margin-bottom: 10px;
    outline: none;
    transition: border-color 0.2s;
}
input:focus, textarea:focus { border-color: #f59e0b; }
textarea { height: 80px; resize: none; }
.btn {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 10px;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
    font-family: inherit;
    transition: opacity 0.2s;
}
.btn:active { opacity: 0.8; }
.btn-send {
    background: linear-gradient(135deg, #f59e0b, #d97706);
    color: #000;
}
.btn-load {
    background: #1e40af;
    color: #fff;
    margin-bottom: 10px;
}
.status {
    margin-top: 12px;
    padding: 12px;
    border-radius: 10px;
    font-size: 13px;
    text-align: center;
    display: none;
}
.status.success { background: rgba(16,185,129,0.15); color: #10b981; border: 1px solid #10b981; }
.status.error { background: rgba(239,68,68,0.15); color: #ef4444; border: 1px solid #ef4444; }
.status.loading { background: rgba(245,158,11,0.15); color: #f59e0b; border: 1px solid #f59e0b; }
.tokens-list {
    max-height: 200px;
    overflow-y: auto;
    margin-top: 10px;
}
.token-item {
    background: #0f172a;
    border-radius: 8px;
    padding: 10px;
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
}
.token-name {
    color: #a78bfa;
    font-size: 14px;
    font-weight: bold;
}
.token-status {
    font-size: 11px;
    padding: 3px 8px;
    border-radius: 20px;
}
.token-status.sent { background: rgba(16,185,129,0.2); color: #10b981; }
.token-status.pending { background: rgba(245,158,11,0.2); color: #f59e0b; }
.token-status.failed { background: rgba(239,68,68,0.2); color: #ef4444; }
.count-badge {
    background: #f59e0b;
    color: #000;
    border-radius: 20px;
    padding: 2px 10px;
    font-size: 12px;
    font-weight: bold;
}

/* شاشة كلمة السر */
#lockScreen {
    position: fixed;
    inset: 0;
    background: #0a0f1e;
    z-index: 9999;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 30px;
}
.lock-card {
    background: #1e293b;
    border-radius: 20px;
    padding: 30px 24px;
    width: 100%;
    max-width: 360px;
    border: 1px solid #334155;
    text-align: center;
}
.lock-card h2 { color: #f59e0b; font-size: 22px; margin-bottom: 8px; }
.lock-card p { color: #64748b; font-size: 13px; margin-bottom: 20px; }
.lock-card input {
    text-align: center;
    font-size: 18px;
    letter-spacing: 4px;
    margin-bottom: 14px;
}
.btn-unlock {
    background: linear-gradient(135deg, #f59e0b, #d97706);
    color: #000;
    font-weight: bold;
    padding: 14px;
    border: none;
    border-radius: 10px;
    width: 100%;
    font-size: 16px;
    cursor: pointer;
    font-family: inherit;
}
.lock-error {
    color: #ef4444;
    font-size: 13px;
    margin-top: 10px;
    display: none;
}
</style>
</head>
<body>

<!-- شاشة كلمة السر -->
<div id="lockScreen">
    <div class="lock-card">
        <h2>🔐 دخول الخادم</h2>
        <p>هذه الصفحة للخادم فقط</p>
        <input type="password" id="passInput" placeholder="كلمة السر" onkeydown="if(event.key==='Enter') unlock()">
        <button class="btn-unlock" onclick="unlock()">دخول ✅</button>
        <p class="lock-error" id="lockError">❌ كلمة السر غلط</p>
    </div>
</div>

<!-- المحتوى الرئيسي -->
<div id="mainContent" style="display:none">

<div class="header">
    <h1>🔔 إرسال إشعارات</h1>
    <p>غصن مثمر — للخادم بس</p>
</div>

<div class="card">
    <h3>👥 المخدومين <span class="count-badge" id="tokenCount">0</span></h3>
    <button class="btn btn-load" onclick="loadTokens()">🔄 تحديث القائمة</button>
    <div class="tokens-list" id="tokensList">
        <p style="color:#64748b; font-size:13px; text-align:center; padding:10px;">⏳ جاري التحميل...</p>
    </div>
</div>

<div class="card">
    <h3>✍️ كتابة الإشعار</h3>
    <input type="text" id="notifTitle" placeholder="عنوان الإشعار..." maxlength="100">
    <textarea id="notifBody" placeholder="نص الإشعار..."></textarea>
    <button class="btn btn-send" onclick="sendToAll()">إرسال للكل 🚀</button>
    <div class="status" id="sendStatus"></div>
</div>

</div>

<script>
// ===== كلمة السر =====
const PASSWORD = 'admin2025'; // غيّرها لأي كلمة تحبها

function unlock() {
    const val = document.getElementById('passInput').value;
    if (val === PASSWORD) {
        document.getElementById('lockScreen').style.display = 'none';
        document.getElementById('mainContent').style.display = 'block';
        loadTokens(); // تحميل تلقائي بعد الدخول
    } else {
        document.getElementById('lockError').style.display = 'block';
        document.getElementById('passInput').value = '';
        document.getElementById('passInput').focus();
    }
}

let tokens = {};

async function getAccessToken() {
    const now = Math.floor(Date.now() / 1000);
    const header = { alg: 'RS256', typ: 'JWT' };
    const payload = {
        iss: CLIENT_EMAIL,
        scope: 'https://www.googleapis.com/auth/firebase.messaging',
        aud: 'https://oauth2.googleapis.com/token',
        exp: now + 3600,
        iat: now
    };

    function b64(str) {
        return btoa(unescape(encodeURIComponent(JSON.stringify(str))))
            .replace(/\+/g, '-').replace(/\//g, '_').replace(/=/g, '');
    }

    const signingInput = b64(header) + '.' + b64(payload);

    const keyData = PRIVATE_KEY
        .replace(/-----BEGIN PRIVATE KEY-----/, '')
        .replace(/-----END PRIVATE KEY-----/, '')
        .replace(/\n/g, '');

    const binaryKey = Uint8Array.from(atob(keyData), c => c.charCodeAt(0));

    const cryptoKey = await crypto.subtle.importKey(
        'pkcs8', binaryKey.buffer,
        { name: 'RSASSA-PKCS1-v1_5', hash: 'SHA-256' },
        false, ['sign']
    );

    const signature = await crypto.subtle.sign(
        'RSASSA-PKCS1-v1_5', cryptoKey,
        new TextEncoder().encode(signingInput)
    );

    const sigB64 = btoa(String.fromCharCode(...new Uint8Array(signature)))
        .replace(/\+/g, '-').replace(/\//g, '_').replace(/=/g, '');

    const jwt = signingInput + '.' + sigB64;

    const tokenRes = await fetch('https://oauth2.googleapis.com/token', {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: `grant_type=urn:ietf:params:oauth:grant-type:jwt-bearer&assertion=${jwt}`
    });

    const tokenData = await tokenRes.json();
    return tokenData.access_token;
}

async function loadTokens() {
    showStatus('sendStatus', 'loading', '⏳ جاري تحميل القائمة...');
    try {
        const res = await fetch(`${DB_URL}/fcm_tokens.json`);
        if (!res.ok) throw new Error('فشل الاتصال بـ Firebase');
        const data = await res.json();
        tokens = data || {};
        const count = Object.keys(tokens).length;
        document.getElementById('tokenCount').textContent = count;

        const list = document.getElementById('tokensList');
        if (count === 0) {
            list.innerHTML = '<p style="color:#64748b; font-size:13px; text-align:center; padding:10px;">مفيش مخدومين مسجلين لحد دلوقتي</p>';
            showStatus('sendStatus', 'error', '❌ مفيش tokens مسجلة');
            return;
        }

        list.innerHTML = Object.entries(tokens).map(([key, val]) => `
            <div class="token-item" id="item-${key}">
                <span class="token-name">👤 ${val.name || key}</span>
                <span class="token-status pending" id="status-${key}">في الانتظار</span>
            </div>
        `).join('');

        showStatus('sendStatus', 'success', `✅ تم تحميل ${count} مخدوم`);
    } catch(e) {
        showStatus('sendStatus', 'error', '❌ خطأ في التحميل: ' + e.message);
    }
}

async function sendToAll() {
    const title = document.getElementById('notifTitle').value.trim();
    const body = document.getElementById('notifBody').value.trim();

    if (!title || !body) {
        showStatus('sendStatus', 'error', '❌ اكتب العنوان والنص');
        return;
    }

    const tokenList = Object.entries(tokens);
    if (tokenList.length === 0) {
        showStatus('sendStatus', 'error', '❌ حمّل القائمة الأول');
        return;
    }

    showStatus('sendStatus', 'loading', `⏳ جاري الإرسال لـ ${tokenList.length} مخدوم...`);

    try {
        const accessToken = await getAccessToken();
        let sent = 0, failed = 0;

        for (const [key, val] of tokenList) {
            const statusEl = document.getElementById('status-' + key);
            if (!val.token) {
                failed++;
                if (statusEl) { statusEl.textContent = 'مفيش token ❌'; statusEl.className = 'token-status failed'; }
                continue;
            }
            try {
                const res = await fetch(
                    `https://fcm.googleapis.com/v1/projects/${PROJECT_ID}/messages:send`,
                    {
                        method: 'POST',
                        headers: {
                            'Authorization': 'Bearer ' + accessToken,
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            message: {
                                token: val.token,
                                notification: { title, body },
                                webpush: {
                                    headers: { Urgency: 'high' },
                                    notification: {
                                        title,
                                        body,
                                        icon: '/jesusmariam7/icon-192.png',
                                        badge: '/jesusmariam7/icon-192.png',
                                        dir: 'rtl',
                                        lang: 'ar',
                                        vibrate: [200, 100, 200],
                                        requireInteraction: true
                                    },
                                    fcm_options: {
                                        link: 'https://abdelsayedzaki-design.github.io/jesusmariam7/jesusmariamstudend.html'
                                    }
                                }
                            }
                        })
                    }
                );
                if (res.ok) {
                    sent++;
                    if (statusEl) { statusEl.textContent = 'وصل ✅'; statusEl.className = 'token-status sent'; }
                } else {
                    const err = await res.json();
                    console.error('FCM Error:', err);
                    failed++;
                    if (statusEl) { statusEl.textContent = 'فشل ❌'; statusEl.className = 'token-status failed'; }
                }
            } catch(e) {
                failed++;
                if (statusEl) { statusEl.textContent = 'فشل ❌'; statusEl.className = 'token-status failed'; }
            }
        }

        // حفظ في Firebase
        await fetch(`${DB_URL}/push_notifications.json`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ title, body, sentAt: Date.now(), sent, failed })
        });

        showStatus('sendStatus', sent > 0 ? 'success' : 'error',
            `${sent > 0 ? '✅' : '❌'} تم الإرسال — وصل: ${sent} | فشل: ${failed}`);

        // مسح الحقول بعد الإرسال الناجح
        if (sent > 0) {
            document.getElementById('notifTitle').value = '';
            document.getElementById('notifBody').value = '';
        }
    } catch(e) {
        showStatus('sendStatus', 'error', '❌ خطأ: ' + e.message);
    }
}

function showStatus(id, type, msg) {
    const el = document.getElementById(id);
    el.className = 'status ' + type;
    el.textContent = msg;
    el.style.display = 'block';
}
</script>
