<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>قراءة العهد الجديد – ٥ أصحاحات يوميًا</title>
<style>
:root{--bg:#faf6ee;--card:#fff;--tx:#2b2418;--mu:#7a6f5c;--ac:#8a5a14;--ln:#e6dcc8;--ok:#2e7d4f}
@media(prefers-color-scheme:dark){:root{--bg:#1c1812;--card:#272117;--tx:#f1e9d8;--mu:#a99d85;--ac:#e0a85a;--ln:#3a3226;--ok:#5fbf86}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Segoe UI",Tahoma,Arial,sans-serif;line-height:1.6}
.w{max-width:680px;margin:auto;padding:16px}
h1{font-size:1.25rem;margin:4px 0 12px;color:var(--ac)}
.bar{height:10px;background:var(--ln);border-radius:9px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok);width:0;transition:width .3s}
.mu{color:var(--mu);font-size:.85rem}
.nav{display:flex;gap:8px;align-items:center;margin:14px 0}
.nav h2{flex:1;text-align:center;margin:0;font-size:1.05rem}
button,select,input[type=date]{font:inherit;background:var(--card);color:var(--tx);border:1px solid var(--ln);border-radius:10px;padding:8px 12px;cursor:pointer}
button.p{background:var(--ac);color:#fff;border-color:var(--ac)}
.card{background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:14px;margin-bottom:12px}
.card.done{border-color:var(--ok)}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.top label{display:flex;gap:8px;align-items:center;font-weight:700;font-size:1.1rem;cursor:pointer}
input[type=checkbox]{width:22px;height:22px;accent-color:var(--ok)}
textarea{width:100%;min-height:70px;margin-top:10px;background:var(--bg);color:var(--tx);border:1px solid var(--ln);border-radius:10px;padding:8px;font:inherit;resize:vertical}
.img{margin-top:8px}
.img img{max-width:100%;border-radius:10px;display:block;margin-top:8px}
.tk{overflow:hidden;direction:ltr;background:#d9822b;color:#fff;border-radius:10px;padding:9px 0;margin:10px 0;cursor:pointer}
.tk span{display:inline-block;white-space:nowrap;padding-left:100%;direction:rtl;font-weight:700;animation:mq 20s linear infinite}
@keyframes mq{to{transform:translateX(-100%)}}
.hd{font-weight:700;color:var(--ac);margin:14px 2px 8px;font-size:1.05rem}
.gt{font-weight:700;margin-bottom:6px;color:var(--ac)}
.set{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:18px;padding-top:12px;border-top:1px solid var(--ln)}
input[type=file]{display:none}
</style>
</head>
<body>
<div class="w">
<h1>📖 قراءة العهد الجديد – ٥ أصحاحات كل يوم</h1>
<div class="bar"><i id="pb"></i></div>
<div id="mb" class="tk" style="display:none"><span id="tkt"></span></div>
<div class="mu" id="sv">⏳ جاري التحميل من السحابة...</div>
<div class="mu" id="pt"></div>
<div class="nav" style="margin-bottom:0"><button id="t1" class="p" style="flex:1">📖 القراءة</button><button id="t2" style="flex:1">🖼️ الصور والتعليقات</button></div>
<div id="rd">
<div class="nav">
<button id="nx">›</button><h2 id="dt"></h2><button id="pv">‹</button>
</div>
<div class="nav" style="margin-top:0"><button id="td" class="p">اليوم</button><select id="sl" style="flex:1"></select></div>
<div id="list"></div>
<div class="set"><span class="mu">تاريخ البداية:</span><input type="date" id="st"></div>
</div>
<div id="gal" style="display:none"></div>
</div>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
<script>
const B=[["متى",28,0],["مرقس",16,0],["لوقا",24,0],["يوحنا",21,0],["أعمال الرسل",28,0],
["رومية",16,1],["كورنثوس الأولى",16,1],["كورنثوس الثانية",13,1],["غلاطية",6,1],["أفسس",6,1],["فيلبي",4,1],["كولوسي",4,1],["تسالونيكي الأولى",5,1],["تسالونيكي الثانية",3,1],["تيموثاوس الأولى",6,1],["تيموثاوس الثانية",4,1],["تيطس",3,1],["فليمون",1,1],["العبرانيين",13,1],["يعقوب",5,1],["بطرس الأولى",5,1],["بطرس الثانية",3,1],["يوحنا الأولى",5,1],["يوحنا الثانية",1,1],["يوحنا الثالثة",1,1],["يهوذا",1,1],
["رؤيا يوحنا",22,2]];
const G=["📜 أناجيل وأعمال","✉️ رسائل","🔥 رؤيا"];
const tr=[[],[],[]];
B.forEach(([n,c,g])=>{for(let i=1;i<=c;i++)tr[g].push(n+" "+i)});
let all=[];
tr.forEach((a,g)=>a.forEach((k,i)=>all.push({k,g,p:(i+.5)/a.length})));
all.sort((a,b)=>a.p-b.p||a.g-b.g);
const sk=k=>k.replace(/ /g,"_");
all.forEach(x=>x.s=sk(x.k));
const ORD=[];tr.forEach(a=>a.forEach(k=>ORD.push(k)));
all.forEach(x=>x.o=ORD.indexOf(x.k));
const D=[];for(let i=0;i<all.length;i+=5)D.push(all.slice(i,i+5));

firebase.initializeApp({apiKey:"AIzaSyBhGsBIFzm-aoSNycttr1djw-c5QuwBNwg",authDomain:"mariam-b85f5.firebaseapp.com",databaseURL:"https://mariam-b85f5-default-rtdb.firebaseio.com/",projectId:"mariam-b85f5",storageBucket:"mariam-b85f5.firebasestorage.app",messagingSenderId:"199175505566",appId:"1:199175505566:web:29aa95ae9e6397fe701d8f"});
const R=firebase.database().ref("personal_reading");
const $=id=>document.getElementById(id);
const iso=d=>{const x=new Date(d);return x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0")+"-"+String(x.getDate()).padStart(2,"0")};
const st=t=>$("sv").textContent=t;
const fail=e=>st("⚠️ ما اتحفظش على السحابة: "+(e&&e.code||"خطأ")+" — تأكد من الإنترنت");
const ok=()=>st("☁️ محفوظ على السحابة");

let S={start:null,read:{},note:{},day:{}};
try{const c=JSON.parse(localStorage.getItem("bible")||"{}");const n=o=>{const r={};for(const k in o||{})r[sk(k)]=o[k];return r};S={start:c.start||null,read:n(c.read),note:n(c.note),day:c.day||{}}}catch(e){}
if(!S.start)S.start=iso(Date.now());
const cache=()=>{try{localStorage.setItem("bible",JSON.stringify(S))}catch(e){}};

const dayOf=d=>Math.floor((new Date(iso(Date.now()))-new Date(d))/864e5);
const todayIdx=()=>Math.max(0,Math.min(D.length-1,dayOf(S.start)));
let cur=todayIdx();

function missed(){
const t=dayOf(S.start),lim=Math.min(D.length,Math.max(0,t)),days=[];let n=0;
for(let i=0;i<lim;i++){const m=D[i].filter(x=>!S.read[x.s]).length;if(m){days.push(i);n+=m}}
return{days,n}}
function banner(){
const m=missed(),msgs=[],f=i=>(i+1).toLocaleString("ar-EG");
if(m.n)msgs.push("⚠️ فاتك "+m.n.toLocaleString("ar-EG")+" أصحاح ما قريتهوش في "+(m.days.length>1?"الأيام":"اليوم")+": "+m.days.slice(0,6).map(f).join("، ")+(m.days.length>6?" ...":""));
const h=new Date().getHours(),d=S.day[iso(Date.now())]||{},need=[];
if(h>=7&&!d.pr)need.push("باكر");if(h>=12&&!d.sx)need.push("السادسة");if(h>=21&&!d.nt)need.push("النوم / نصف الليل");
if(need.length)msgs.push("🙏 لسه ما صليتش النهاردة: "+need.join("، "));
if(h>=20&&!d.ch)msgs.push("🚪 مخدعي الخاص النهاردة لسه");
const b=$("mb");
if(!msgs.length){b.style.display="none";return}
const t=msgs.join("      •      ");
b.style.display="";
if($("tkt").textContent!==t){$("tkt").textContent=t;$("tkt").style.animationDuration=(10+t.length*.14)+"s"}
b.onclick=()=>{cur=m.n?m.days[0]:todayIdx();render()}}
setInterval(()=>banner(),60000);
function prog(){
banner();
const n=all.filter(x=>S.read[x.s]).length;
$("pb").style.width=(n/all.length*100)+"%";
$("pt").textContent="قرأت "+n+" من "+all.length+" أصحاحًا ("+Math.round(n/all.length*100)+"٪)";
}
const shrink=f=>new Promise(r=>{const im=new Image();im.onload=()=>{const s=Math.min(1,800/im.width),c=document.createElement("canvas");c.width=im.width*s;c.height=im.height*s;c.getContext("2d").drawImage(im,0,0,c.width,c.height);r(c.toDataURL("image/jpeg",.65))};im.src=URL.createObjectURL(f)});
const tm={};
function saveNote(s,v){S.note[s]=v;cache();clearTimeout(tm[s]);st("⏳ جاري الحفظ...");tm[s]=setTimeout(()=>R.child("state/note/"+s).set(v||null).then(ok,fail),700)}

let inG=false;
function tab(n){inG=n==2;$("t1").classList.toggle("p",n==1);$("t2").classList.toggle("p",n==2);history.replaceState(null,"",n==2?"#album":location.pathname)}
function render(){
$("gal").style.display="none";$("rd").style.display="";tab(1);
const dd=new Date(S.start);dd.setDate(dd.getDate()+cur);
const isT=cur==todayIdx()&&dayOf(S.start)>=0;
$("dt").innerHTML="اليوم "+(cur+1)+" من "+D.length+"<br><span class='mu'>"+dd.toLocaleDateString("ar-EG",{weekday:"long",day:"numeric",month:"long"})+(isT?" • اليوم":"")+"</span>";
$("sl").value=cur;$("st").value=S.start;
const L=$("list");L.innerHTML="";
const hd=t=>{const e=document.createElement("div");e.className="hd";e.textContent=t;return e};
L.appendChild(hd("📖 الكتاب المقدس"));
const dk=iso(dd);
for(const x of D[cur]){
const c=document.createElement("div");c.className="card"+(S.read[x.s]?" done":"");
c.innerHTML=`<div class="top"><label><input type="checkbox" ${S.read[x.s]?"checked":""}> ${x.k}</label><span class="mu">${G[x.g]}</span></div>
<textarea placeholder="تعليقك على هذا الأصحاح..."></textarea>
<div class="img"><label><button type="button">📷 إضافة صورة</button><input type="file" accept="image/*"></label> <button type="button" class="rm" style="display:none">حذف الصورة</button><div class="pv"></div></div>`;
const cb=c.querySelector("input[type=checkbox]"),ta=c.querySelector("textarea"),fi=c.querySelector("input[type=file]"),pv=c.querySelector(".pv"),rm=c.querySelector(".rm");
ta.value=S.note[x.s]||"";
cb.onchange=()=>{S.read[x.s]=cb.checked;c.classList.toggle("done",cb.checked);cache();prog();R.child("state/read/"+x.s).set(cb.checked||null).then(ok,fail)};
ta.oninput=()=>saveNote(x.s,ta.value);
const show=u=>{pv.innerHTML=u?`<img src="${u}">`:"";rm.style.display=u?"":"none"};
c.querySelector(".img button").onclick=()=>fi.click();
fi.onchange=async()=>{if(!fi.files[0])return;st("⏳ جاري رفع الصورة...");const u=await shrink(fi.files[0]);show(u);R.child("img/"+x.s).set(u).then(ok,fail)};
rm.onclick=()=>{show(null);R.child("img/"+x.s).remove().then(ok,fail)};
R.child("img/"+x.s).once("value").then(s=>show(s.val()),()=>{});
L.appendChild(c);
}
const chk=(label,k)=>{const l=document.createElement("label");l.style.cssText="display:flex;gap:10px;align-items:center;padding:7px 0;cursor:pointer;font-size:1.05rem";const c=document.createElement("input");c.type="checkbox";c.checked=!!(S.day[dk]&&S.day[dk][k]);c.onchange=()=>{S.day[dk]=S.day[dk]||{};S.day[dk][k]=c.checked||null;cache();banner();R.child("state/day/"+dk+"/"+k).set(c.checked||null).then(ok,fail)};l.append(c,label);return l};
L.appendChild(hd("🕯️ الأجبية"));
const pc=document.createElement("div");pc.className="card";
pc.append(chk("🌅 باكر","pr"),chk("☀️ الساعة السادسة ⭐ (الأهم)","sx"),chk("🌙 النوم / نصف الليل","nt"));
L.appendChild(pc);
L.appendChild(hd("🚪 مخدعي الخاص"));
const mc=document.createElement("div");mc.className="card";
mc.append(chk("صليت مخدعي الخاص","ch"));
L.appendChild(mc);
prog();
}

async function gallery(){
$("rd").style.display="none";$("gal").style.display="";tab(2);
const g=$("gal");g.innerHTML="<div class='mu'>⏳ جاري تحميل الألبوم...</div>";
let im={};try{im=(await R.child("img").once("value")).val()||{}}catch(e){fail(e)}
const items=all.filter(x=>im[x.s]||S.note[x.s]).sort((a,b)=>a.o-b.o);
g.innerHTML="<h2 style='font-size:1.05rem;text-align:center'>🖼️ الصور والتعليقات ("+items.length+")</h2>"+(items.length?"":"<div class='mu'>لسه ما فيش صور أو تعليقات.</div>");
items.forEach(x=>{
const c=document.createElement("div");c.className="card";
c.innerHTML=`<div class="gt">${x.k}</div>`;
if(im[x.s]){const i=document.createElement("img");i.src=im[x.s];i.style.cssText="max-width:100%;border-radius:10px;display:block;margin-bottom:8px";c.appendChild(i);
const a=document.createElement("a");a.href=im[x.s];a.download=x.s+".jpg";a.textContent="⬇️ تنزيل الصورة";a.className="mu";a.style.display="block";c.appendChild(a)}
if(S.note[x.s]){const p=document.createElement("div");p.style.whiteSpace="pre-wrap";p.textContent=S.note[x.s];c.appendChild(p)}
g.appendChild(c)});
}

$("sl").innerHTML=D.map((d,i)=>`<option value="${i}">اليوم ${i+1}: ${d[0].k} ← ${d[d.length-1].k}</option>`).join("");
$("sl").onchange=e=>{cur=+e.target.value;render()};
$("nx").onclick=()=>{if(cur<D.length-1){cur++;render()}};
$("pv").onclick=()=>{if(cur>0){cur--;render()}};
$("td").onclick=()=>{cur=todayIdx();render()};
$("t2").onclick=gallery;$("t1").onclick=render;
$("st").onchange=e=>{if(e.target.value){S.start=e.target.value;cache();R.child("state/start").set(S.start).then(ok,fail);cur=todayIdx();render()}};
if(location.hash=="#album")gallery();else render();
// تحميل من السحابة (ولو أول مرة بيرفع اللي على الجهاز)
R.child("state").once("value").then(s=>{
const v=s.val();
if(v){S.start=v.start||S.start;S.read=v.read||{};S.note=v.note||{};S.day=v.day||{};cache();cur=todayIdx();inG?gallery():render();ok()}
else R.child("state").set({start:S.start,read:S.read,note:S.note,day:S.day}).then(()=>{ok();inG?gallery():render()},fail);
},fail);
</script>
</body>
</html>
